<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Tennant Character Sort</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="start-screen" class="screen active">
      <div class="hero">
        <p class="eyebrow">DAVID TENNANT CHARACTER SORT</p>
        <h1>あなたの推しDTキャラ<br>TOP9を決めよう</h1>
        <p class="lead">
          4人の中から好きな2人を選びながら、推しキャラを絞っていきます。
          知らないキャラはスキップできます。
        </p>

        <div class="mode-card">
          <label for="mode">テーマ</label>
          <select id="mode">
            <option value="favorite">一番好きなキャラ</option>
            <option value="date">付き合いたいキャラ</option>
            <option value="face">顔が好きなキャラ</option>
            <option value="danger">危険だけど惹かれるキャラ</option>
          </select>
        </div>

        <button id="start-btn" class="primary-btn">START</button>
      </div>
    </section>

    <section id="sort-screen" class="screen">
      <header class="sort-header">
        <div>
          <p class="eyebrow">ROUND <span id="round-number">1</span></p>
          <h2 id="question">この中から好きな2人を選んでください</h2>
        </div>
        <div class="progress-wrap">
          <div id="progress-text">0 / 0</div>
          <div class="progress"><div id="progress-bar"></div></div>
        </div>
      </header>

      <div id="character-grid" class="character-grid"></div>

      <div class="sort-actions">
        <button id="skip-btn" class="ghost-btn">この4人は保留</button>
        <button id="next-btn" class="primary-btn" disabled>この2人で決定</button>
      </div>
    </section>

    <section id="final-screen" class="screen">
      <div class="result-header">
        <p class="eyebrow">YOUR RESULT</p>
        <h2>YOUR DT CHARACTER TOP 9</h2>
        <p id="result-subtitle"></p>
      </div>

      <div id="ranking-grid" class="ranking-grid"></div>

      <div class="result-actions">
        <button id="restart-btn" class="ghost-btn">もう一度やる</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
