<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>デイヴィッド・テナント キャラクター 推し9選</title>
  <meta name="description" content="97人のキャラクターから、あなたのデイヴィッド・テナント推しキャラTOP9を決めよう。">
  <meta property="og:title" content="デイヴィッド・テナント キャラクター 推し9選">
  <meta property="og:description" content="4人の中から推しを選んで、あなたのTOP9を作ろう。">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css?v=20261007-7">
</head>
<body>
<main>
  <section id="home" class="screen active">
    <div class="home-wrap">
      <div id="hero-collage" class="hero-collage"></div>
      <div class="hero-copy">
        <p class="small-title">デイヴィッド・テナント</p>
        <h1><span>好き顔</span>9選</h1>
        <p class="description">写真を見比べて、好きな顔を選ぼう。</p>
        <p id="member-count" class="count"></p>
        <button id="start-btn" class="start-btn">診断を開始する →</button>
      </div>
    </div>
  </section>

  <section id="quiz" class="screen">
    <div class="quiz-wrap">
      <div class="progress-row">
        <div id="percent">0%</div>
        <div class="progress"><div id="bar"></div></div>
      </div>
      <h2>この中で、一番好きなキャラクターは？</h2>
      <div id="choices" class="choices"></div>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="result-wrap">
      <p class="small-title">RESULT</p>
      <h2>あなたの推しキャラ9選</h2>
      <div id="ranking" class="ranking"></div>

      <div class="share-panel">
        <button id="share-btn" class="share-btn">Xで画像付き共有</button>
        <button id="save-btn" class="secondary-btn">結果画像を保存</button>
        <p class="share-note">クリックすると結果画像を自動保存し、#DTCharacterSort 付きのX投稿作成画面を開きます。</p>
      </div>

      <div class="result-actions">
        <button id="restart-btn" class="secondary-btn">もう一度やる</button>
      </div>
    </div>
  </section>
</main>
<script src="app.js?v=20261007-7"></script>
</body>
</html>
